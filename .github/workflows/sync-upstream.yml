name: Sync upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.repository == 'x0ba/paper-rs'
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          parent="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name // empty')"
          if [ -z "${parent}" ]; then
            echo "::error::${GITHUB_REPOSITORY} is not a fork; no upstream to sync."
            exit 1
          fi

          compare_ref="${parent%%/*}:main...${GITHUB_REPOSITORY%%/*}:main"
          tsv="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${compare_ref}" --jq '[.status, .ahead_by, .behind_by] | @tsv')"
          IFS=$'\t' read -r status ahead behind <<<"${tsv}"

          echo "GET /repos/${GITHUB_REPOSITORY}/compare/${compare_ref}"
          echo "status=${status} ahead=${ahead} behind=${behind}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "pull_request dry check only; no write was performed."
            exit 0
          fi

          case "${status}" in
            identical)
              echo "Already up to date with ${parent}."
              exit 0
              ;;
            ahead)
              echo "Fork main is ahead of ${parent}; nothing to merge from upstream."
              exit 0
              ;;
            behind|diverged)
              ;;
            *)
              echo "::error::Unexpected compare status '${status}' (ahead=${ahead} behind=${behind})."
              exit 1
              ;;
          esac

          set +e
          response="$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            -f branch=main 2>&1)"
          ec=$?
          set -e
          printf '%s\n' "${response}"

          if [ "${ec}" -ne 0 ]; then
            case "${response}" in
              *"HTTP 409"*|*"conflict"*|*"Conflict"*)
                echo "::error::merge-upstream reported a conflict (HTTP 409). This workflow will not force-push or overwrite fork commits. Resolve the conflict manually."
                ;;
              *)
                echo "::error::merge-upstream failed. This workflow will not force-push or overwrite fork commits."
                ;;
            esac
            exit 1
          fi

          merge_type="$(printf '%s\n' "${response}" | jq -r '.merge_type // empty')"
          case "${merge_type}" in
            fast-forward|merge|none)
              ;;
            *)
              echo "::error::Unexpected merge-upstream merge_type='${merge_type}'."
              exit 1
              ;;
          esac

          echo "Synced main from ${parent} (merge_type=${merge_type})."

          if [ "${merge_type}" != "none" ]; then
            echo "Dispatching Build macOS on main (GITHUB_TOKEN pushes do not trigger push workflows)."
            gh workflow run build-macos.yml --ref main
          fi
